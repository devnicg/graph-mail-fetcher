name: Release

# Publishes a GitHub release whenever main carries a <Version> that has no v<Version> tag yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PROJECT: src/GraphMailFetcher/GraphMailFetcher.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PROJECT")
          if [ -z "$version" ]; then
            echo "No <Version> found in $PROJECT" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        if: steps.version.outputs.new == 'true'
        run: |
          version=${{ steps.version.outputs.version }}
          mkdir -p artifacts
          for rid in win-x64 linux-x64; do
            dotnet publish "$PROJECT" -c Release -r "$rid" --self-contained true \
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o "publish/$rid"
            cp README.md "publish/$rid/"
            (cd "publish/$rid" && zip -r "../../artifacts/graph-mail-fetcher-$version-$rid.zip" .)
          done

      - name: Create release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" artifacts/*.zip \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
